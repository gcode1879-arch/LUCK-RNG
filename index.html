<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUCK RNG</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;overflow:hidden;background:linear-gradient(135deg,#ff6ec4,#7873f5,#2dd4bf,#facc15);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
button{font:inherit;color:inherit;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.f{position:absolute;bottom:-60px;animation:rise linear infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.screen{position:relative;z-index:2;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:20px}
.screen.on{display:flex}
h1{display:flex;align-items:center;gap:14px;font-size:clamp(40px,11vw,100px);margin:0;letter-spacing:4px;text-shadow:0 4px 0 #5b21b6,0 8px 24px rgba(0,0,0,.35);animation:bob 3s ease-in-out infinite}
h1 svg{width:1em;height:1em;filter:drop-shadow(0 4px 0 #5b21b6)}
@keyframes bob{50%{transform:translateY(-10px) scale(1.03)}}
.big{font-weight:900;letter-spacing:3px;color:#064e3b;background:linear-gradient(#fde047,#facc15);border:0;border-radius:999px;box-shadow:0 8px 0 #ca8a04,0 14px 30px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s}
.big:hover:not(:disabled){transform:translateY(-3px) scale(1.04)}
.big:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 #ca8a04}
.big:disabled{filter:grayscale(.5);opacity:.8;cursor:wait}
#play{font-size:clamp(30px,7vw,52px);padding:18px 70px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 8px 0 #ca8a04,0 0 40px 10px rgba(253,224,71,.8)}}
.small{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:8px 18px}
.small:hover{background:rgba(0,0,0,.5)}
.small svg{width:18px;height:18px}
/* game */
#game{justify-content:space-between;padding:16px 16px 28px}
.top{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:flex;gap:10px}
.stat{background:rgba(0,0,0,.35);border-radius:14px;padding:8px 16px;min-width:110px}
.stat small{display:block;font-size:12px;opacity:.8;letter-spacing:1px;text-transform:uppercase}
.stat b{font-size:22px}
.mid{display:flex;flex-direction:column;align-items:center;gap:22px}
.label{font-size:13px;letter-spacing:2px;opacity:.85;text-transform:uppercase}
#card{width:210px;height:250px;border-radius:24px;background:rgba(0,0,0,.35);border:4px solid var(--c,rgba(255,255,255,.4));box-shadow:0 0 36px var(--c,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#card svg{width:110px;height:110px}
#card .nm{font-size:22px;font-weight:800}
#card .rr{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--c)}
#card.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}60%{transform:scale(1.12)}100%{transform:none}}
#card.spin svg{animation:spin .25s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#roll{font-size:clamp(34px,8vw,54px);padding:20px 90px}
.bot{display:flex;gap:14px}
.bot .small{font-size:17px;padding:12px 26px}
#card{position:relative}
.p{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--c);pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:4px solid var(--c);border-radius:50%;pointer-events:none;animation:ring .8s ease-out forwards}
@keyframes ring{to{transform:scale(14);opacity:0}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:var(--c)}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-9px,4px)}40%{transform:translate(9px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,3px)}}
#card.glitch{animation:gl 1.6s steps(1) both}
@keyframes gl{0%{transform:none}8%{transform:translate(-12px,3px) skewX(14deg);filter:hue-rotate(90deg) invert(1)}16%{transform:translate(14px,-4px) skewX(-16deg);filter:hue-rotate(200deg)}24%{transform:translate(-6px,6px) scaleY(.8)}32%{transform:translate(8px,0) scaleX(1.2);filter:invert(1)}44%{transform:none;filter:none}56%{transform:translate(-5px,2px) skewX(8deg);filter:hue-rotate(300deg)}68%{transform:none;filter:none}78%{transform:translate(4px,-3px);filter:invert(1)}100%{transform:none;filter:none}}
#card.glitch .nm{text-shadow:3px 0 #f0f,-3px 0 #0ff}
#card.glitch svg{animation:gls .12s steps(2) 12}
@keyframes gls{50%{transform:translate(5px,-3px);opacity:.55}}
#reward .panel{text-align:center;width:min(320px,88vw);border:4px solid var(--c);box-shadow:0 0 40px var(--c);animation:pop .5s}
#reward .hd{font-weight:900;font-size:26px;letter-spacing:2px}
#reward .hd.new{color:#fde047}
#reward .hd.dup{color:#94a3b8}
#reward svg{width:110px;height:110px;margin:12px 0 4px}
#reward .nm{font-size:26px;font-weight:800}
#reward .rr{font-weight:800;letter-spacing:2px;color:var(--c);margin:4px 0 12px}
#reward p{margin:0 0 18px;opacity:.9}
/* modal */
.modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.modal.on{display:flex}
.panel{background:#1e1b4b;border-radius:20px;padding:22px 24px;width:min(560px,92vw);max-height:82vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.panel h2{margin:0 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:18px}
.row input{width:22px;height:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.it{background:rgba(255,255,255,.07);border:2px solid var(--c);border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;position:relative}
.it svg{width:46px;height:46px;display:block;margin:0 auto 4px}
.it.lock{background:#000;border-color:#333;color:#777}
.it.lock svg{opacity:.55}
.bar{height:14px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#fde047);transition:width .4s}
.it .n{position:absolute;top:4px;right:8px;font-weight:800;font-size:12px}
.r0,.r1,.r2,.r3,.r4,.r5,.r6{position:relative}
:is(.it,.ic,#card,#reward .panel).r0{background:#2b2d3a}
:is(.it,.ic,#card,#reward .panel).r1{background:linear-gradient(160deg,#14532d,#0b2a1a);box-shadow:0 0 14px rgba(74,222,128,.45)}
:is(.it,.ic,#card,#reward .panel).r2{background:linear-gradient(160deg,#0c4a6e,#06263d);box-shadow:0 0 22px rgba(56,189,248,.6)}
:is(.it,.ic,#card,#reward .panel).r3{background:linear-gradient(160deg,#4c1d95,#2e1065);box-shadow:0 0 26px rgba(192,132,252,.7)}
:is(.it,.ic,#card,#reward .panel).r4{background:linear-gradient(160deg,#92400e,#451a03);box-shadow:0 0 32px rgba(251,191,36,.85)}
:is(.it,.ic,#card,#reward .panel).r5{background:linear-gradient(0deg,#7f1d1d,#2a0707);box-shadow:0 0 32px rgba(239,68,68,.85)}
:is(.it,.ic,#card,#reward .panel).r6{background:repeating-linear-gradient(0deg,#000 0 3px,#17002b 3px 6px);border-color:#a855f7;box-shadow:0 0 34px #a855f7,inset 0 0 20px #000}
.r3::after,.r4::after,.r5::after,.r6::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.r3::after{background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);background-size:250% 100%;animation:sheen 2.8s linear infinite}
.r4::after{background:linear-gradient(110deg,transparent 30%,rgba(255,240,180,.45) 50%,transparent 70%);background-size:250% 100%;box-shadow:0 0 28px 3px rgba(251,191,36,.9);animation:sheen 1.8s linear infinite,glow 1.6s ease-in-out infinite}
.r5::after{background:radial-gradient(circle at 50% 110%,rgba(255,140,40,.8),transparent 65%);transform-origin:50% 100%;animation:fire 1.1s ease-in-out infinite alternate}
.r6::after{background:linear-gradient(180deg,transparent,rgba(168,85,247,.45),transparent) 0 0/100% 30% no-repeat;animation:scan 2s linear infinite}
.r6 .nm,.r6 .in{text-shadow:2px 0 #a855f7,-2px 0 #0ff}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes glow{50%{opacity:.25}}
@keyframes fire{from{opacity:.4;transform:scaleY(.85)}to{opacity:1;transform:scaleY(1.05)}}
@keyframes scan{from{background-position:0 -40%}to{background-position:0 140%}}
#unk{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2e0b4f 0%,#12031f 60%,#050008 100%);opacity:0;transition:opacity .7s}
#unk.on{display:flex}
#unk.show{opacity:1}
#unk::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 5px);pointer-events:none}
#unkBody{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center}
.uq{opacity:0;transform:scale(.4);transition:opacity 1.2s,transform 1.2s}
.uq.in{opacity:1;transform:scale(1)}
.uq.gl{animation:gl .6s steps(1)}
.uq svg{width:min(46vw,200px);height:min(46vw,200px);filter:drop-shadow(0 0 24px #a855f7);animation:uqp 1.6s ease-in-out infinite}
@keyframes uqp{50%{transform:scale(1.08);filter:drop-shadow(0 0 40px #c084fc)}}
.un{font-size:clamp(26px,7vw,38px);font-weight:900;letter-spacing:3px;color:#f3e8ff;text-shadow:0 0 14px #a855f7;min-height:1.3em}
.ur{font-weight:800;letter-spacing:5px;color:#a855f7;text-shadow:2px 0 #0ff,-2px 0 #f0f}
.ua{font-size:14px;letter-spacing:2px;color:#d8b4fe;min-height:1.2em}
#game.sglitch{animation:gl .8s steps(1)}
body.noanim,body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
.top .stats{width:84px}
.gtitle{display:flex;align-items:center;gap:6px;font-weight:900;letter-spacing:2px;font-size:20px;text-shadow:0 2px 0 #5b21b6}
.gtitle svg{width:24px;height:24px}
.stats2{display:flex;gap:10px}
.bot{flex-wrap:wrap;justify-content:center;max-width:540px}
.bot .small{font-size:15px;padding:10px 18px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
[hidden]{display:none!important}
#prog{width:min(360px,90vw)}
.pl{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800}
.ttl{margin-top:6px;font-size:12px;font-weight:800;letter-spacing:2px;color:#fde047}
.lr{font-size:14px;opacity:.9;margin:-6px 0 16px}
.spb{font-weight:700;margin-bottom:10px}.spb b{color:#fde047;font-size:22px}.spb span{display:block;font-size:12px;opacity:.7}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px}
.tab svg{width:20px;height:20px}
.tab.on{border-color:var(--c);background:rgba(255,255,255,.18)}
.bdesc{opacity:.8;margin:6px 0 10px;font-size:14px}
.sk{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin:0 0 8px 12px;position:relative}
.sk::before{content:"";position:absolute;left:-17px;top:-10px;width:2px;height:calc(100% + 8px);background:var(--c);opacity:.4}
.sk.first::before{display:none}
.sk.own{background:rgba(255,255,255,.14)}
.sn b{display:block}.se{display:block;font-size:13px;opacity:.85}.sm{display:block;font-size:11px;opacity:.6;margin-top:2px}
.ok{color:#4ade80;font-weight:800;font-size:13px}.lk{font-size:12px;opacity:.6;text-align:right;display:block;max-width:110px}
.buy{background:#facc15;color:#064e3b;border:0}
body.divine #card::before{content:"";position:absolute;inset:-7px;border-radius:30px;background:conic-gradient(#f87171,#fde047,#4ade80,#38bdf8,#c084fc,#f87171);filter:blur(10px);z-index:-1;animation:spin2 5s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.empty{opacity:.7;padding:10px 0}
.ic{background:rgba(255,255,255,.07);border:2px solid var(--c);border-radius:14px;padding:12px 8px;text-align:center}
.ic svg{width:56px;height:56px;display:block;margin:0 auto 6px}
.in{font-weight:800;font-size:14px}
.ir{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--c);margin:2px 0 8px}
.iq{display:inline-block;background:rgba(0,0,0,.4);border-radius:999px;padding:2px 12px;font-weight:900;font-size:15px}
</style>
</head>
<body>
<div id="fx"></div>
<div id="flash"></div>

<main id="start" class="screen on">
  <h1><svg viewBox="0 0 24 24" fill="#4ade80" stroke="#14532d" stroke-width="1"><circle cx="8" cy="8" r="4.5"/><circle cx="16" cy="8" r="4.5"/><circle cx="8" cy="15" r="4.5"/><circle cx="16" cy="15" r="4.5"/><path d="M12 13c0 4 1 6 3 8" stroke-width="2" fill="none"/></svg>LUCK RNG</h1>
  <button class="big" id="play">PLAY</button>
  <button class="small" data-open="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
</main>

<main id="game" class="screen">
  <div class="top">
    <button class="small" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg>Menu</button>
    <div class="gtitle"><svg viewBox="0 0 24 24" fill="#4ade80" stroke="#14532d" stroke-width="1"><circle cx="8" cy="8" r="4.5"/><circle cx="16" cy="8" r="4.5"/><circle cx="8" cy="15" r="4.5"/><circle cx="16" cy="15" r="4.5"/></svg>LUCK RNG</div><div class="stats">
      
      
    </div>
  </div>
  <div class="mid">
    <div class="label">Latest roll</div>
    <div id="card"><svg viewBox="0 0 24 24" fill="#f472b6" stroke="#fff" stroke-width="1" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="1"/><rect x="2" y="7" width="20" height="4" rx="1" fill="#fb7185"/><path d="M12 7v14" stroke="#fde047" stroke-width="2"/><path d="M12 7C9 1 5 3 7 5.500 8 6.500 12 7 12 7zM12 7c3-6 7-4 5-1.500-1 1-5 1.500-5 1.500z" fill="#fde047"/></svg><div class="nm">Mystery gift</div><div class="rr">Press ROLL to open</div></div>
    <button class="big" id="roll">ROLL!</button>
    <div id="prog"></div>
    <div class="stats2"><button class="small" id="auto" hidden></button><button class="small" id="boost" hidden></button></div>
    <div class="stats2"><div class="stat"><small>Total rolls</small><b id="rolls">0</b></div><div class="stat"><small>Best rarity</small><b id="best">None</b></div></div>
  </div>
  <div class="bot">
    <button class="small" data-open="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16v12H4zM8 8V5h8v3"/></svg>Inventory</button>
    <button class="small" data-open="col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Collection</button>
    <button class="small" data-open="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button>
    <button class="small" data-open="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21v-8M12 13L6 8M12 13l6-5M6 8V4M18 8V4"/></svg>Skill Tree</button>
    <button class="small" data-open="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</button>
  </div>
</main>

<div class="modal" id="settings"><div class="panel" style="width:min(340px,90vw)"><h2>Settings</h2>
  <label class="row">Animations <input type="checkbox" id="anim" checked></label>
  <label class="row">Music <input type="checkbox" id="mus" checked></label>
  <label class="row">Sound effects <input type="checkbox" id="snd" checked></label>
  <button class="small" id="reset" style="width:100%;justify-content:center;margin:6px 0 14px;border-color:#f87171;color:#fecaca">Reset progress</button>
  <button class="small" data-close>Close</button></div></div>
<div class="modal" id="inv"><div class="panel"><h2>Inventory</h2><div id="invBody"></div><button class="small" data-close>Close</button></div></div>
<div class="modal" id="col"><div class="panel"><h2>Collection <span id="colCount" style="font-size:16px;opacity:.8"></span></h2><div id="colProg"></div><div id="colBody"></div><button class="small" data-close>Close</button></div></div>

<div class="modal" id="skills"><div class="panel" style="width:min(620px,94vw)"><h2>Skill Tree</h2><div id="skBody"></div><button class="small" data-close style="margin-top:12px">Close</button></div></div>
<div class="modal" id="stats"><div class="panel"><h2>Stats</h2><div id="statsBody"></div><button class="small" data-close style="margin-top:14px">Close</button></div></div>
<div id="unk"><div id="unkBody"></div></div>
<div class="modal" id="reward"><div class="panel"><div id="rwBody"></div><button class="big small" data-close style="color:#064e3b;background:#facc15;border:0;font-size:18px;padding:10px 30px">Continue</button></div></div>

<script>
const $=id=>document.getElementById(id);
const CARD0=$('card').innerHTML;
const R=[{n:'Common',c:'#9ca3af',o:2},{n:'Uncommon',c:'#4ade80',o:5},{n:'Rare',c:'#38bdf8',o:20},{n:'Epic',c:'#c084fc',o:100},{n:'Legendary',c:'#fbbf24',o:500},{n:'Mythical',c:'#ef4444',o:2000},{n:'UNKNOWN',c:'#a855f7',o:100000}];
const S={
 clover:'<circle cx="8" cy="8" r="4.5"/><circle cx="16" cy="8" r="4.5"/><circle cx="8" cy="15" r="4.5"/><circle cx="16" cy="15" r="4.5"/>',
 star:'<path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/>',
 gem:'<path d="M6 3h12l4 6-10 12L2 9z"/>',
 drop:'<path d="M12 2c4 5 7 8 7 12a7 7 0 0 1-14 0c0-4 3-7 7-12z"/>',
 moon:'<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
 bolt:'<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>',
 heart:'<path d="M12 21C5 15 2 11 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 3-3 7-10 13z"/>',
 crown:'<path d="M3 18l-1-11 6 5 4-8 4 8 6-5-1 11zM3 20h18v2H3z"/>',
 hex:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/>'};
const I0=[['Pebble','hex'],['Leaf','drop'],['Penny','moon'],
 ['Lucky Clover','clover'],['Bright Star','star'],['Dewdrop','drop'],
 ['Blue Gem','gem'],['Moon Charm','moon'],['Spark','bolt'],
 ['Amethyst','gem'],['Heartstone','heart'],['Storm Bolt','bolt'],
 ['Golden Clover','clover'],['Sun Crown','crown'],['Shooting Star','star'],
 ['Rainbow Heart','heart'],['Cosmic Crown','crown'],['Infinity Gem','gem'],['Glitch Clover','clover']].map((x,i)=>({name:x[0],s:x[1],r:Math.floor(i/3)}));
Object.assign(S,{
 clover:S.clover+'<path d="M12 13c0 4 1 6 3 8" fill="none" stroke-width="2"/>',

  p.style.setProperty('--x',Math.cos(a)*l+'px');p.style.setProperty('--y',Math.sin(a)*l+'px');if(rb)p.style.background='hsl('+Math.random()*40+',95%,55%)';c.appendChild(p);setTimeout(()=>p.remove(),1000)}};
 const ring=()=>{const e=document.createElement('i');e.className='ring';c.appendChild(e);setTimeout(()=>e.remove(),900)};
 const flash=cl=>{const f=$('flash');f.style.setProperty('--c',cl||col);f.classList.remove('go');void f.offsetWidth;f.classList.add('go')};
 const shake=()=>{g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')};
 if(r>=1)burst(10,110);if(bonus('star'))burst(18,150,true);
 if(r>=2)ring();
 if(r>=3){burst(24,170);flash()}
 if(r>=4){shake();burst(40,240);ring();setTimeout(ring,200)}
 if(r===5){burst(50,300,true);setTimeout(ring,400);setTimeout(()=>flash('#fff'),250)}
 if(r===6){shake();['#f0f','#0ff','#fff','#f00'].forEach((cl,i)=>setTimeout(()=>flash(cl),i*180));setTimeout(shake,700)}
}
function roll(){const btn=$('roll'),c=$('card');btn.disabled=true;sfx.click();
 const res=pick(),total=st.anim?(bonus('reveal')?9:14):3;let k=0;
 (function step(){
  if(k<total){const f=I[Math.floor(Math.random()*I.length)];
   c.classList.remove('pop','glitch');c.className=c.className.replace(/\br\d\b/g,'').trim();c.style.setProperty('--c','rgba(255,255,255,.5)');
   c.innerHTML=`${icon({s:f.s,r:0})}<div class="nm">Rolling...</div><div class="rr">&nbsp;</div>`;
   sfx.tick(k%8);k++;setTimeout(step,(60+Math.pow(k/total,3)*380)/(1+bonus('speed')/100))}
  else{const isNew=!st.inv[res.name];st.rolls++;st.rar[res.r]=(st.rar[res.r]||0)+1;st.inv[res.name]=(st.inv[res.name]||0)+1;if(res.r>st.best)st.best=res.r;st.last=I.indexOf(res);giveRewards(res,isNew);save();
   if(res.r===6){st.auto=false;$('rolls').textContent=st.rolls.toLocaleString();unknownSeq(res,isNew,st.inv[res.name]);return}
   showCard(res,true);sfx.reveal(res.r);effect(res.r);refresh();setTimeout(()=>{btn.disabled=false;if(st.auto){setTimeout(()=>{if(st.auto&&!btn.disabled&&$('game').classList.contains('on')&&!document.querySelector('.modal.on'))roll()},bonus('turbo')?500:1500)}else reward(res,isNew,st.inv[res.name])},bonus('reveal')?500:1000)}
 })()}
function invTile(it,n){const r=R[it.r];return `<div class="ic r${it.r}" style="--c:${r.c}">${icon(it)}<div class="in">${it.name}</div><div class="ir">${r.n.toUpperCase()}</div><div class="iq">x${n}</div></div>`}
function tile(it,have,cnt){return `<div class="it${have?' r'+it.r:' lock'}" style="--c:${R[it.r].c}">${cnt?`<span class="n">x${cnt}</span>`:''}${have?icon(it):'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M8 8a4 4 0 1 1 6 3.5c-1.5 1-2 1.7-2 3.5M12 19v.5"/></svg>'}${have?it.name:'???'}</div>`}
function applyAnim(){document.body.classList.toggle('noanim',!st.anim);fx.style.display=st.anim?'block':'none'}
function showStats(){const d=I.filter(i=>st.inv[i.name]).length,pc=Math.round(d/I.length*100),own=Object.values(st.inv).reduce((a,b)=>a+b,0);
 const top=I.filter(i=>st.inv[i.name]).sort((a,b)=>b.r-a.r)[0];
 const box=(l,v,c)=>`<div class="stat" style="min-width:0"><small>${l}</small><b${c?` style="color:${c}"`:''}>${v}</b></div>`;
 $('statsBody').innerHTML=`<div class="sgrid">${box('Total rolls',st.rolls.toLocaleString())}${box('Best rarity',st.best<0?'None':R[st.best].n,st.best<0?'':R[st.best].c)}${box('Items owned',own.toLocaleString())}${box('Collected',d+' / '+I.length)}${box('Level',lvl(st.xp))}${box('Coins',Math.floor(st.coins).toLocaleString())}</div><div style="font-weight:800;margin:14px 0 6px">Collection ${pc}% complete</div><div class="bar"><i style="width:${pc}%"></i></div>${top?`<div style="margin-bottom:10px">Rarest item: <b style="color:${R[top.r].c}">${top.name}</b></div>`:''}<div style="font-weight:800;margin:6px 0">Rolls by rarity</div>${R.map((r,i)=>`<div class="row" style="margin:6px 0;font-size:16px"><span style="color:${r.c};font-weight:800">${r.n}</span><b>${(st.rar[i]||0).toLocaleString()}</b></div>`).join('')}`}
function open(id){$(id).classList.add('on');if(id==='stats')showStats();if(id==='skills')skills();
 if(id==='inv'){const own=I.filter(i=>st.inv[i.name]).sort((a,b)=>b.r-a.r||st.inv[b.name]-st.inv[a.name]);
  $('invBody').innerHTML=own.length?`<div class="grid">${own.map(i=>invTile(i,st.inv[i.name])).join('')}</div>`:'<div class="empty">Your inventory is empty. Press ROLL to get your first item!</div>'}
 if(id==='col'){let h='';R.forEach((r,ri)=>{h+=`<div style="color:${r.c};font-weight:800;margin:6px 0">${r.n} <span style="opacity:.7;font-size:13px;font-weight:600">${r.d} &middot; 1 in ${r.o.toLocaleString()} &middot; ${I.filter(i=>i.r===ri&&st.inv[i.name]).length}/${I.filter(i=>i.r===ri).length}</span></div><div class="grid">${I.filter(i=>i.r===ri).map(i=>tile(i,st.inv[i.name])).join('')}</div>`});
  $('colBody').innerHTML=h;const d=I.filter(i=>st.inv[i.name]).length,pc=Math.round(d/I.length*100);$('colCount').textContent=pc+'%';$('colProg').innerHTML=`<div style="font-weight:800;margin-bottom:6px">${d} / ${I.length} discovered, ${pc}% complete</div><div class="bar"><i style="width:${pc}%"></i></div>`}}
$('play').onclick=()=>{initAudio();sfx.click();show('game')};
$('back').onclick=()=>{sfx.click();show('start')};
$('roll').onclick=roll;
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{sfx.click();open(b.dataset.open)});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{sfx.click();b.closest('.modal').classList.remove('on')});
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('on')});
$('anim').checked=st.anim;$('mus').checked=st.mus;$('snd').checked=st.snd;applyAnim();
$('anim').onchange=e=>{st.anim=e.target.checked;applyAnim();save()};
let rt;$('reset').onclick=()=>{const b=$('reset');
 if(b.dataset.arm){clearTimeout(rt);delete b.dataset.arm;b.textContent='Reset progress';
  st.rolls=0;st.best=-1;st.inv={};st.rar=[0,0,0,0,0,0,0];st.last=-1;st.xp=0;st.coins=0;st.sk={};st.dn={};st.boost={d:'',n:0};st.auto=false;save();
  const c=$('card');c.className='';c.style.removeProperty('--c');c.innerHTML=CARD0;refresh();sfx.click()}
 else{b.dataset.arm=1;b.textContent='Tap again to confirm';rt=setTimeout(()=>{delete b.dataset.arm;b.textContent='Reset progress'},4000)}};
$('mus').onchange=e=>{st.mus=e.target.checked;applyVol();save()};
$('snd').onchange=e=>{st.snd=e.target.checked;applyVol();save()};
refresh();if(st.last>=0)showCard(I[st.last]);
</script>
</body>
